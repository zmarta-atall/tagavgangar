<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Avgångar Ängelholm – Tåg & Buss</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #0a0a0f; color: #e0e0e0; min-height: 100vh; }

  .login-screen { display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 1rem; }
  .login-box { background: #141420; border: 1px solid #2a2a3a; border-radius: 1rem; padding: 2.5rem; max-width: 400px; width: 100%; }
  .login-box h1 { text-align: center; font-size: 1.5rem; margin-bottom: 0.3rem; }
  .login-box .subtitle { text-align: center; color: #888; margin-bottom: 1.5rem; }
  .login-box .icon { text-align: center; font-size: 2.5rem; margin-bottom: 0.8rem; }
  label { display: block; font-size: 0.85rem; color: #888; margin-bottom: 0.4rem; }
  input[type="text"] { width: 100%; padding: 0.75rem 1rem; background: #1a1a2a; border: 1px solid #333; border-radius: 0.5rem; color: #fff; font-size: 0.95rem; outline: none; }
  input[type="text"]:focus { border-color: #4a7cff; }
  .btn { width: 100%; padding: 0.75rem; background: #2563eb; color: #fff; border: none; border-radius: 0.5rem; font-size: 1rem; font-weight: 600; cursor: pointer; margin-top: 1rem; }
  .btn:hover { background: #3b7aff; }
  .btn:disabled { background: #333; color: #666; cursor: default; }
  .hint { text-align: center; font-size: 0.75rem; color: #555; margin-top: 1rem; }
  .hint a { color: #4a7cff; text-decoration: none; }

  .app { max-width: 750px; margin: 0 auto; padding: 1rem; }
  .header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 1.2rem; flex-wrap: wrap; gap: 0.5rem; }
  .header h1 { font-size: 1.2rem; }
  .header .meta { font-size: 0.7rem; color: #555; margin-top: 0.2rem; }
  .header-btns { display: flex; gap: 0.4rem; }
  .header-btns button { padding: 0.4rem 0.8rem; background: #1a1a2a; border: 1px solid #333; color: #aaa; border-radius: 0.4rem; cursor: pointer; font-size: 0.8rem; }
  .header-btns button:hover { background: #252535; }

  .filter-bar { margin-bottom: 1rem; display: flex; align-items: center; gap: 0.8rem; font-size: 0.85rem; color: #888; }
  .filter-bar input[type="checkbox"] { accent-color: #2563eb; }

  .error { background: #3b1111; border: 1px solid #6b2222; color: #e88; padding: 0.75rem 1rem; border-radius: 0.5rem; margin-bottom: 1rem; font-size: 0.9rem; }
  .info { background: #112233; border: 1px solid #224466; color: #8ac; padding: 0.75rem 1rem; border-radius: 0.5rem; margin-bottom: 1rem; font-size: 0.85rem; }
  .empty { text-align: center; color: #555; padding: 3rem 0; }

  table { width: 100%; border-collapse: collapse; background: #141420; border-radius: 0.7rem; overflow: hidden; border: 1px solid #2a2a3a; }
  thead tr { background: #1a1a2a; }
  th { padding: 0.7rem 0.7rem; text-align: left; font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.05em; color: #666; font-weight: 600; }
  th:nth-child(4), th:nth-child(5) { text-align: center; }
  td { padding: 0.7rem; border-top: 1px solid #1e1e2e; font-size: 0.9rem; }
  td:nth-child(4), td:nth-child(5) { text-align: center; }
  .time { font-family: 'SF Mono', 'Consolas', monospace; font-size: 1.05rem; font-weight: 700; }
  .est { font-size: 0.8rem; color: #f59e0b; font-weight: 400; }
  .train-id { font-weight: 600; }
  .train-type { font-size: 0.8rem; color: #888; }
  .status-ok { color: #22c55e; font-weight: 600; font-size: 0.85rem; }
  .status-late { color: #f59e0b; font-weight: 600; font-size: 0.85rem; }
  .status-canceled { color: #ef4444; font-weight: 600; font-size: 0.85rem; }
  .status-early { color: #38bdf8; font-weight: 600; font-size: 0.85rem; }
  .deviation { font-size: 0.7rem; color: #eab308; margin-top: 0.2rem; }
  .canceled-row { opacity: 0.45; }
  .direction { font-size: 1rem; font-weight: 700; margin: 1.2rem 0 0.5rem; }
  .direction:first-child { margin-top: 0; }

  .section-title { font-size: 1.1rem; font-weight: 700; margin: 2rem 0 0.5rem; padding-top: 1.2rem; border-top: 1px solid #2a2a3a; }
  .section-title:first-child { border-top: none; margin-top: 0; padding-top: 0; }
  .bus-line { display: inline-block; background: #2563eb; color: #fff; border-radius: 0.25rem; padding: 0.1rem 0.4rem; font-size: 0.75rem; font-weight: 700; margin-right: 0.3rem; }

  .tab-bar { display: flex; gap: 0; margin-bottom: 1rem; border-bottom: 2px solid #2a2a3a; }
  .tab-bar button { flex: 1; padding: 0.6rem 0.5rem; background: none; border: none; border-bottom: 2px solid transparent; color: #666; font-size: 0.85rem; font-weight: 600; cursor: pointer; margin-bottom: -2px; }
  .tab-bar button.active { color: #e0e0e0; border-bottom-color: #2563eb; }
  .tab-bar button:hover:not(.active) { color: #aaa; }
</style>
</head>
<body>

<div id="login" class="login-screen">
  <div class="login-box">
    <div class="icon">🚆🚌</div>
    <h1>Avgångar Ängelholm</h1>
    <p class="subtitle">Tåg & lokalbuss</p>
    <label for="apikey">Trafikverket API-nyckel (tåg)</label>
    <input type="text" id="apikey" placeholder="Nyckel från data.trafikverket.se">
    <div style="margin-top:0.8rem">
      <label for="resrobotkey">Trafiklab Realtime-nyckel (buss realtid)</label>
      <input type="text" id="resrobotkey" placeholder="Trafiklab Realtime API-nyckel">
    </div>
    <div style="margin-top:0.8rem">
      <label for="resrobotaccess">ResRobot-nyckel (buss rutter)</label>
      <input type="text" id="resrobotaccess" placeholder="ResRobot v2.1 API-nyckel">
    </div>
    <button class="btn" id="startBtn" disabled onclick="start()">Visa avgångar</button>
    <p class="hint">Gratis nycklar från <a href="https://data.trafikverket.se" target="_blank">Trafikverket</a> och <a href="https://www.trafiklab.se" target="_blank">Trafiklab</a></p>
  </div>
</div>

<div id="app" class="app" style="display:none">
  <div class="header">
    <div>
      <h1 id="title">🚆🚌 Avgångar Ängelholm</h1>
      <div class="meta" id="meta"></div>
    </div>
    <div class="header-btns">
      <button onclick="fetchAll()">🔄 Uppdatera</button>
      <button onclick="logout()">Byt nyckel</button>
    </div>
  </div>
  <div id="error"></div>
  <div class="tab-bar" id="tabs" style="display:none">
    <button class="active" onclick="switchTab('trains')">🚆 Tåg</button>
    <button onclick="switchTab('buses')">🚌 Buss</button>
  </div>
  <div id="content"></div>
  <div id="busContent" style="display:none"></div>
</div>

<script>
const API = "https://api.trafikinfo.trafikverket.se/v2/data.json";
const REALTIME_API = "https://realtime-api.trafiklab.se/v1";
const RESROBOT_API = "https://api.resrobot.se/v2.1";
let apiKey = "", resrobotKey = "", resrobotAccessId = "", interval = null;
let fromSig = "", toSig = "";
let activeTab = "trains";
// Direction 1: Ängelholm → Helsingborg
let depFromA = [], arrAtB = [];
// Direction 2: Helsingborg → Ängelholm
let depFromB = [], arrAtA = [];
// Bus data
let busStortorgetToStation = [], busStationToStortorget = [];
// ResRobot stop IDs for Ängelholm (pre-looked-up)
let stortorgetStopId = "740031349", stationStopId = "740000064";

const $ = id => document.getElementById(id);

const saved = localStorage.getItem("tvApiKey");
const savedRR = localStorage.getItem("rrApiKey");
const savedRB = localStorage.getItem("rbApiKey");
if (saved) {
  $("apikey").value = saved;
  $("startBtn").disabled = false;
}
if (savedRR) $("resrobotkey").value = savedRR;
if (savedRB) $("resrobotaccess").value = savedRB;
if (saved) start();

$("apikey").addEventListener("input", e => {
  $("startBtn").disabled = !e.target.value.trim();
});
$("apikey").addEventListener("keydown", e => {
  if (e.key === "Enter" && e.target.value.trim()) start();
});
$("resrobotkey").addEventListener("keydown", e => {
  if (e.key === "Enter" && $("apikey").value.trim()) start();
});
$("resrobotaccess").addEventListener("keydown", e => {
  if (e.key === "Enter" && $("apikey").value.trim()) start();
});

async function lookupStations() {
  // LIKE uses regex in Trafikverket API
  const query = `<REQUEST>
  <LOGIN authenticationkey="${apiKey}" />
  <QUERY objecttype="TrainStation" schemaversion="1.4" limit="10">
    <FILTER>
      <LIKE name="AdvertisedLocationName" value=".*ngelholm.*" />
    </FILTER>
    <INCLUDE>LocationSignature</INCLUDE>
    <INCLUDE>AdvertisedLocationName</INCLUDE>
  </QUERY>
  <QUERY objecttype="TrainStation" schemaversion="1.4">
    <FILTER>
      <LIKE name="AdvertisedLocationName" value="Helsingborg C" />
    </FILTER>
    <INCLUDE>LocationSignature</INCLUDE>
    <INCLUDE>AdvertisedLocationName</INCLUDE>
  </QUERY>
</REQUEST>`;

  const res = await fetch(API, {
    method: "POST",
    headers: { "Content-Type": "text/xml" },
    body: query
  });
  const data = await res.json();
  const results = data.RESPONSE?.RESULT || [];

  // Debug: show raw result structure
  const debugParts = results.map((r, i) => {
    if (r.ERROR) return `Q${i}: ERROR ${r.ERROR.MESSAGE}`;
    if (r.TrainStation) return `Q${i}: ${r.TrainStation.length} st [${r.TrainStation.map(s => s.AdvertisedLocationName + "=" + s.LocationSignature).join(", ")}]`;
    return `Q${i}: ${JSON.stringify(Object.keys(r))}`;
  });
  $("meta").textContent = debugParts.join(" | ");

  const ahStations = results[0]?.TrainStation || [];
  const hbStations = results[1]?.TrainStation || [];

  const ahMatch = ahStations.find(s => !s.AdvertisedLocationName.toLowerCase().includes("flygplats")) || ahStations[0];
  if (ahMatch) fromSig = ahMatch.LocationSignature;
  if (hbStations.length > 0) toSig = hbStations[0].LocationSignature;

  if (!fromSig || !toSig) {
    throw new Error(`Saknar station: from=${fromSig || "?"} to=${toSig || "?"}`);
  }
}

async function start() {
  apiKey = $("apikey").value.trim();
  resrobotKey = $("resrobotkey").value.trim();
  resrobotAccessId = $("resrobotaccess").value.trim();
  if (!apiKey) return;
  localStorage.setItem("tvApiKey", apiKey);
  if (resrobotKey) localStorage.setItem("rrApiKey", resrobotKey);
  else localStorage.removeItem("rrApiKey");
  if (resrobotAccessId) localStorage.setItem("rbApiKey", resrobotAccessId);
  else localStorage.removeItem("rbApiKey");
  $("login").style.display = "none";
  $("app").style.display = "block";
  $("content").innerHTML = '<div class="empty">Slår upp stationer...</div>';

  try {
    await lookupStations();
    if (resrobotKey && resrobotAccessId) {
      $("tabs").style.display = "flex";
    }
    await fetchAll();
    interval = setInterval(fetchAll, 60000);
  } catch (e) {
    $("error").innerHTML = `<div class="error">${e.message}</div>`;
  }
}

function switchTab(tab) {
  activeTab = tab;
  for (const btn of $("tabs").children) btn.classList.remove("active");
  if (tab === "trains") {
    $("tabs").children[0].classList.add("active");
    $("content").style.display = "";
    $("busContent").style.display = "none";
  } else {
    $("tabs").children[1].classList.add("active");
    $("content").style.display = "none";
    $("busContent").style.display = "";
  }
}

async function fetchAll() {
  await fetchTrains();
  resrobotKey = $("resrobotkey").value.trim();
  resrobotAccessId = $("resrobotaccess").value.trim();
  if (resrobotKey && resrobotAccessId) {
    localStorage.setItem("rrApiKey", resrobotKey);
    localStorage.setItem("rbApiKey", resrobotAccessId);
    $("tabs").style.display = "flex";
    await fetchBuses();
  }
}

function logout() {
  clearInterval(interval);
  localStorage.removeItem("tvApiKey");
  localStorage.removeItem("rrApiKey");
  localStorage.removeItem("rbApiKey");
  apiKey = "";
  resrobotKey = "";
  resrobotAccessId = "";
  fromSig = "";
  toSig = "";
  depFromA = []; arrAtB = [];
  depFromB = []; arrAtA = [];
  busStortorgetToStation = []; busStationToStortorget = [];
  stortorgetStopId = "740031349"; stationStopId = "740000064";
  activeTab = "trains";
  $("login").style.display = "flex";
  $("app").style.display = "none";
  $("apikey").value = "";
  $("resrobotkey").value = "";
  $("resrobotaccess").value = "";
  $("startBtn").disabled = true;
  $("error").innerHTML = "";
  $("tabs").style.display = "none";
}

function depQuery(stationSig) {
  return `<QUERY objecttype="TrainAnnouncement" schemaversion="1.9" orderby="AdvertisedTimeAtLocation" limit="15">
    <FILTER>
      <AND>
        <EQ name="LocationSignature" value="${stationSig}" />
        <EQ name="ActivityType" value="Avgang" />
        <GT name="AdvertisedTimeAtLocation" value="${new Date().toISOString()}" />
      </AND>
    </FILTER>
    <INCLUDE>AdvertisedTrainIdent</INCLUDE>
    <INCLUDE>AdvertisedTimeAtLocation</INCLUDE>
    <INCLUDE>EstimatedTimeAtLocation</INCLUDE>
    <INCLUDE>TimeAtLocation</INCLUDE>
    <INCLUDE>ToLocation</INCLUDE>
    <INCLUDE>TrackAtLocation</INCLUDE>
    <INCLUDE>Canceled</INCLUDE>
    <INCLUDE>ProductInformation</INCLUDE>
    <INCLUDE>Deviation</INCLUDE>
  </QUERY>`;
}

function arrQuery(stationSig) {
  return `<QUERY objecttype="TrainAnnouncement" schemaversion="1.9" limit="50">
    <FILTER>
      <AND>
        <EQ name="LocationSignature" value="${stationSig}" />
        <EQ name="ActivityType" value="Ankomst" />
        <GT name="AdvertisedTimeAtLocation" value="${new Date().toISOString()}" />
      </AND>
    </FILTER>
    <INCLUDE>AdvertisedTrainIdent</INCLUDE>
    <INCLUDE>AdvertisedTimeAtLocation</INCLUDE>
    <INCLUDE>EstimatedTimeAtLocation</INCLUDE>
  </QUERY>`;
}

function buildQuery() {
  return `<REQUEST>
  <LOGIN authenticationkey="${apiKey}" />
  ${depQuery(fromSig)}
  ${arrQuery(toSig)}
  ${depQuery(toSig)}
  ${arrQuery(fromSig)}
</REQUEST>`;
}

function fmtTime(iso) {
  if (!iso) return null;
  return new Date(iso).toLocaleTimeString("sv-SE", { hour: "2-digit", minute: "2-digit" });
}

function getDelay(adv, est) {
  if (!est || !adv) return 0;
  return Math.round((new Date(est) - new Date(adv)) / 60000);
}

async function fetchTrains() {
  $("error").innerHTML = "";
  try {
    const res = await fetch(API, {
      method: "POST",
      headers: { "Content-Type": "text/xml" },
      body: buildQuery()
    });
    const data = await res.json();
    const results = data.RESPONSE?.RESULT || [];

    for (const r of results) {
      if (r.ERROR) throw new Error(r.ERROR.MESSAGE);
    }

    // Q0: dep from Ä, Q1: arr at Hb, Q2: dep from Hb, Q3: arr at Ä
    depFromA = results[0]?.TrainAnnouncement || [];
    arrAtB   = results[1]?.TrainAnnouncement || [];
    depFromB = results[2]?.TrainAnnouncement || [];
    arrAtA   = results[3]?.TrainAnnouncement || [];

    $("meta").textContent = `Uppdaterad ${new Date().toLocaleTimeString("sv-SE")} – uppdateras varje minut`;
    renderAll();
  } catch (e) {
    $("error").innerHTML = `<div class="error">${e.message || "Kunde inte hämta data"}</div>`;
  }
}

function matchTrains(departures, arrivals) {
  const arrMap = {};
  for (const a of arrivals) arrMap[a.AdvertisedTrainIdent] = a;
  const matched = departures.filter(t => {
    const arr = arrMap[t.AdvertisedTrainIdent];
    return arr && arr.AdvertisedTimeAtLocation > t.AdvertisedTimeAtLocation;
  });
  return { trains: matched.slice(0, 2), arrMap };
}

function renderAll() {
  const dir1 = matchTrains(depFromA, arrAtB);
  const dir2 = matchTrains(depFromB, arrAtA);

  let html = "";
  html += `<div class="direction">Ängelholm → Helsingborg C</div>`;
  html += renderTable(dir1.trains, dir1.arrMap);
  html += `<div class="direction">Helsingborg C → Ängelholm</div>`;
  html += renderTable(dir2.trains, dir2.arrMap);

  $("content").innerHTML = html;
}

function renderTable(trains, arrMap) {
  if (!trains.length) {
    return `<div class="empty">Inga kommande avgångar</div>`;
  }

  let html = `<table><thead><tr><th>Avg.</th><th>Ank.</th><th>Tåg</th><th>Spår</th><th>Status</th></tr></thead><tbody>`;

  for (const t of trains) {
    const time = fmtTime(t.AdvertisedTimeAtLocation);
    const est = fmtTime(t.EstimatedTimeAtLocation);
    const delay = getDelay(t.AdvertisedTimeAtLocation, t.EstimatedTimeAtLocation);
    const canceled = t.Canceled;

    const arr = arrMap[t.AdvertisedTrainIdent];
    const arrTime = arr ? fmtTime(arr.AdvertisedTimeAtLocation) : "—";
    const arrEst = arr ? fmtTime(arr.EstimatedTimeAtLocation) : null;
    const arrDelay = arr ? getDelay(arr.AdvertisedTimeAtLocation, arr.EstimatedTimeAtLocation) : 0;

    const product = (t.ProductInformation || [])
      .map(p => typeof p === "string" ? p : (p.Description || p.Code || ""))
      .join(", ");
    const dev = (t.Deviation || [])
      .map(d => typeof d === "string" ? d : (d.Description || d.Code || ""))
      .join(", ");
    const track = t.TrackAtLocation || "—";

    let statusClass = "status-ok", statusText = "I tid";
    if (canceled) { statusClass = "status-canceled"; statusText = "Inställt"; }
    else if (delay > 0) { statusClass = "status-late"; statusText = `+${delay} min`; }
    else if (t.TimeAtLocation) { statusClass = "status-ok"; statusText = "Avgått"; }

    const rowClass = canceled ? "canceled-row" : "";
    const estHtml = est && delay > 0 ? `<div class="est">→ ${est}</div>` : "";
    const arrEstHtml = arrEst && arrDelay > 0 ? `<div class="est">→ ${arrEst}</div>` : "";
    const devHtml = dev ? `<div class="deviation">${dev}</div>` : "";

    html += `<tr class="${rowClass}">
      <td><span class="time">${time}</span>${estHtml}</td>
      <td><span class="time">${arrTime}</span>${arrEstHtml}</td>
      <td><span class="train-id">${t.AdvertisedTrainIdent}</span><div class="train-type">${product}</div></td>
      <td>${track}</td>
      <td><span class="${statusClass}">${statusText}</span>${devHtml}</td>
    </tr>`;
  }

  html += `</tbody></table>`;
  return html;
}

// ── Bus (Trafiklab Realtime) ──

async function rtFetch(endpoint) {
  const url = `${REALTIME_API}/${endpoint}${endpoint.includes("?") ? "&" : "?"}key=${resrobotKey}`;
  const res = await fetch(url);
  if (!res.ok) throw new Error(`Trafiklab ${res.status}: ${res.statusText}`);
  return res.json();
}

async function rrFetch(params) {
  const url = new URL(`${RESROBOT_API}/trip`);
  url.searchParams.set("accessId", resrobotAccessId);
  url.searchParams.set("format", "json");
  for (const [k, v] of Object.entries(params)) url.searchParams.set(k, v);
  const res = await fetch(url);
  if (!res.ok) throw new Error(`ResRobot ${res.status}: ${res.statusText}`);
  return res.json();
}

function parseTrips(data) {
  const trips = data.Trip || [];
  return trips.map(trip => {
    let legs = trip.LegList.Leg;
    if (!Array.isArray(legs)) legs = [legs];
    const leg = legs.find(l => l.type !== "WALK") || legs[0];
    const prods = Array.isArray(leg.Product) ? leg.Product : [leg.Product].filter(Boolean);
    return {
      time: leg.Origin.time,
      arrTime: leg.Destination.time,
      line: prods[0]?.line || "",
      name: prods[0]?.name || "",
      direction: leg.direction || "",
      cancelled: false,
      delay: null,
      is_realtime: false,
      platform: null
    };
  }).filter(t => t.line);
}

function enrichWithRealtime(trips, departures) {
  for (const trip of trips) {
    const schedHH = trip.time.substring(0, 5);
    const match = departures.find(d =>
      d.route?.designation === trip.line &&
      d.scheduled?.substring(11, 16) === schedHH
    );
    if (match) {
      trip.delay = match.delay || 0;
      trip.is_realtime = match.is_realtime || false;
      trip.cancelled = match.canceled || false;
      trip.platform = match.realtime_platform?.designation || match.scheduled_platform?.designation || null;
    }
  }
  return trips;
}

function filterPastBuses(trips) {
  const now = new Date();
  const today = now.toLocaleDateString("sv-SE");
  return trips.filter(t => {
    const [h, m] = t.time.split(":").map(Number);
    const delayMin = t.delay !== null ? Math.round(t.delay / 60) : 0;
    const dep = new Date(`${today}T${String(h).padStart(2,"0")}:${String(m).padStart(2,"0")}:00`);
    dep.setMinutes(dep.getMinutes() + delayMin);
    return dep > now;
  });
}

async function fetchBuses() {
  if (!stortorgetStopId || !stationStopId) return;
  try {
    // ResRobot for correct routes, Realtime API for delays
    // Fetch trips starting 15 min ago to catch delayed buses whose
    // scheduled time has passed but haven't actually departed yet.
    const earlier = new Date(Date.now() - 15 * 60000);
    const rrTime = earlier.toLocaleTimeString("sv-SE", { hour: "2-digit", minute: "2-digit" });
    const rrDate = earlier.toLocaleDateString("sv-SE"); // YYYY-MM-DD
    const [tripsToStat, tripsToStort, depsStort, depsStat] = await Promise.all([
      rrFetch({ originId: stortorgetStopId, destId: stationStopId, numF: 6, time: rrTime, date: rrDate }),
      rrFetch({ originId: stationStopId, destId: stortorgetStopId, numF: 6, time: rrTime, date: rrDate }),
      rtFetch(`departures/${stortorgetStopId}`),
      rtFetch(`departures/${stationStopId}`)
    ]);

    busStortorgetToStation = filterPastBuses(enrichWithRealtime(
      parseTrips(tripsToStat), depsStort.departures || []));
    busStationToStortorget = filterPastBuses(enrichWithRealtime(
      parseTrips(tripsToStort), depsStat.departures || []));

    renderBuses();
  } catch (e) {
    $("busContent").innerHTML = `<div class="error">Buss: ${e.message}</div>`;
  }
}

function renderBuses() {
  let html = "";
  html += `<div class="direction">🚌 Stortorget → Stationen</div>`;
  html += renderBusTable(busStortorgetToStation.slice(0, 5));
  html += `<div class="direction">🚌 Stationen → Stortorget</div>`;
  html += renderBusTable(busStationToStortorget.slice(0, 5));
  $("busContent").innerHTML = html;
}

function renderBusTable(deps) {
  if (!deps.length) {
    return `<div class="empty">Inga kommande bussavgångar</div>`;
  }
  let html = `<table><thead><tr><th>Avg.</th><th>Ank.</th><th>Linje</th><th>Läge</th><th>Status</th></tr></thead><tbody>`;

  for (const d of deps) {
    const time = d.time.substring(0, 5);
    const arrTime = d.arrTime ? d.arrTime.substring(0, 5) : "—";
    const delay = d.delay !== null ? Math.round(d.delay / 60) : null;
    const canceled = d.cancelled;
    const platform = d.platform || "—";

    let rtTime = null;
    if (delay !== null && delay !== 0) {
      const [h, m] = d.time.split(":").map(Number);
      const totalMin = h * 60 + m + delay;
      rtTime = `${String(Math.floor(totalMin / 60) % 24).padStart(2, "0")}:${String(totalMin % 60).padStart(2, "0")}`;
    }

    let statusClass = "status-ok", statusText = "I tid";
    if (canceled) { statusClass = "status-canceled"; statusText = "Inställt"; }
    else if (delay !== null && delay > 0) { statusClass = "status-late"; statusText = `+${delay} min`; }
    else if (delay !== null && delay < 0) { statusClass = "status-early"; statusText = `${delay} min`; }
    else if (!d.is_realtime) { statusClass = "status-ok"; statusText = "Planerad"; }

    const rowClass = canceled ? "canceled-row" : "";
    const estHtml = rtTime ? `<div class="est">→ ${rtTime}</div>` : "";

    html += `<tr class="${rowClass}">
      <td><span class="time">${time}</span>${estHtml}</td>
      <td><span class="time">${arrTime}</span></td>
      <td><span class="bus-line">${d.line}</span> <span class="train-type">${d.name}</span></td>
      <td>${platform}</td>
      <td><span class="${statusClass}">${statusText}</span></td>
    </tr>`;
  }

  html += `</tbody></table>`;
  return html;
}
</script>
</body>
</html>
